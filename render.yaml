# Render blueprint. Deploys the app as a Node service rather than from the
# Dockerfile: fewer moving parts, and the Dockerfile has not been exercised.
services:
  - type: web
    name: alarm-configurator
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production is set below, and npm ci
    # honours it by skipping devDependencies — which is where Vite and the
    # TypeScript toolchain live, so the build would have nothing to build with.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start --workspace @alarm/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alarm-configurator-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Off by default: the hooks need no authentication, so with them on
      # anyone who reads the README could reset the public demo.
      - key: TEST_SUPPORT
        value: "0"
      # Seed once, on the first boot against an empty database. A redeploy
      # must not wipe whatever visitors have done since.
      - key: SEED_ON_START
        value: if-empty
      - key: SEED_PROFILE
        value: demo
      # This instance is a public sandbox with published credentials, so it
      # says so on every page.
      - key: DEMO_MODE
        value: "1"
      # Open on the public sandbox, closed everywhere else so the seeded-users
      # baseline the test framework is written against stays unchanged.
      - key: REGISTRATION_OPEN
        value: "1"
      # Email. The three secret-ish values are set in the dashboard rather
      # than committed here.
      - key: MAIL_TRANSPORT
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_IGNORE_TLS
        value: "0"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LIST_DELAY_MS
        value: "600"

databases:
  - name: alarm-configurator-db
    plan: free
    databaseName: alarm_configurator
    user: alarm_app
