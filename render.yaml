# Render blueprint. Deploys the Dockerfile's `api` image, which is its last
# stage and so the default target. CI's `container` job builds and starts the
# same image on every push. The image's CMD runs boot.js: migrate, seed if the
# database is empty, then serve.
services:
  - type: web
    name: alarm-configurator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alarm1-configurator-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Off by default: the hooks need no authentication, so with them on
      # anyone who reads the README could reset the public demo.
      - key: TEST_SUPPORT
        value: "0"
      # Seed once, on the first boot against an empty database. A redeploy
      # must not wipe whatever visitors have done since.
      - key: SEED_ON_START
        value: if-empty
      - key: SEED_PROFILE
        value: demo
      # This instance is a public sandbox with published credentials, so it
      # says so on every page.
      - key: DEMO_MODE
        value: "1"
      # Open on the public sandbox, closed everywhere else so the seeded-users
      # baseline the test framework is written against stays unchanged.
      - key: REGISTRATION_OPEN
        value: "1"
      # Email. The three secret-ish values are set in the dashboard rather
      # than committed here.
      # Over HTTPS, not SMTP: Render blocks outbound SMTP ports, so a
      # connection to smtp-relay.brevo.com:587 times out however correct the
      # credentials are.
      - key: MAIL_TRANSPORT
        value: brevo
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LIST_DELAY_MS
        value: "600"

databases:
  - name: alarm1-configurator-db
    plan: free
    # Matches the replacement created in the dashboard on 1 November 2026, so a
    # Blueprint sync describes the database that exists rather than another.
    databaseName: alarm1_configurator_db
    user: alarm1_configurator_db_user
